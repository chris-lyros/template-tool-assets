<!-- Quote Automator (Webflow Embed) - Mobile-first rebuild -->

<div id="loading-message" class="state-panel">
  <div class="state-card">
    <div class="spinner"></div>
    <p>Verifying access…</p>
  </div>
</div>

<div id="access-denied-message" class="state-panel" style="display:none;">
  <div class="state-card">
    <h2>Access Denied</h2>
    <p>Your session has expired or is invalid.</p>
    <a href="https://www.lyros.com.au/quote-login" class="btn btn-primary btn-block">Return to Login</a>
  </div>
</div>

<div id="quote-wrapper" style="display:none;">
  <main class="quote-container" aria-live="polite">
    <header class="quote-header">
      <h1>Quote <span>Automator</span></h1>
      <div class="status-bar">
        <span class="badge">Field Mode</span>
        <div class="user-info-container">
          <span class="user-info" id="user-email-display">Loading…</span>
          <button class="logout-btn" id="logout-btn" type="button">Logout</button>
        </div>
      </div>
    </header>

    <section class="accordion-section is-open" data-accordion>
      <button class="accordion-header" type="button" data-accordion-trigger aria-expanded="true">
        <span class="accordion-title">Generate New Quote</span>
        <span class="accordion-chevron">⌄</span>
      </button>
      <div class="accordion-content" data-accordion-content>
        <div class="accordion-body">
          <div id="generate-feedback" class="feedback-message" role="status" aria-live="polite"></div>
          <form id="generate-quote-form">
            <div class="form-group card-highlight">
              <label class="checkbox-row">
                <input type="checkbox" id="skip-ai-processing" name="skip_ai_processing" />
                <span>
                  <strong>Template already has placeholders</strong>
                  <small>Skip AI and use placeholders like [CLIENT_NAME].</small>
                </span>
              </label>
            </div>

            <div class="form-group">
              <label for="template-selector">Select Registered Template <span class="required">*</span></label>
              <select id="template-selector" name="template_id" required>
                <option value="">Loading templates…</option>
              </select>
            </div>

            <div class="form-group">
              <label for="quote-file-input">Upload Quote Info <span class="required">*</span></label>
              <label class="upload-zone" for="quote-file-input" id="quote-upload-zone">
                <span class="upload-title">Tap to choose files</span>
                <span class="upload-subtitle">PDF, DOCX, TXT (max 10MB each)</span>
                <input type="file" id="quote-file-input" multiple accept=".pdf,.docx,.txt" />
              </label>
              <div id="quote-file-list" class="file-list"></div>
            </div>

            <div class="form-group">
              <label for="text-instructions">Text Instructions (optional)</label>
              <textarea id="text-instructions" name="text_instructions" rows="4" placeholder="Add site notes, exclusions, and scope hints…"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="generate-quote-btn">Generate Quote</button>
          </form>
        </div>
      </div>
    </section>

    <section class="accordion-section" data-accordion>
      <button class="accordion-header" type="button" data-accordion-trigger aria-expanded="false">
        <span class="accordion-title">My Templates</span>
        <span class="accordion-chevron">⌄</span>
      </button>
      <div class="accordion-content" data-accordion-content>
        <div class="accordion-body">
          <button class="btn btn-secondary btn-block" id="open-register-modal" type="button">Register New Template</button>
          <div id="template-list" class="template-list"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="register-template-overlay" class="modal-overlay" aria-hidden="true">
  <div class="modal">
    <h3>Register Template</h3>
    <div id="register-feedback" class="feedback-message" role="status" aria-live="polite"></div>
    <form id="template-registration-form">
      <div class="form-group">
        <label for="template-name">Template Name <span class="required">*</span></label>
        <input id="template-name" name="template_name" required maxlength="80" />
      </div>
      <div class="form-group">
        <label for="industry">Industry</label>
        <input id="industry" name="industry" placeholder="Electrical, Plumbing, HVAC…" />
      </div>
      <div class="form-group">
        <label for="template-file-input">Template DOCX <span class="required">*</span></label>
        <label class="upload-zone" for="template-file-input" id="template-upload-zone">
          <span class="upload-title">Tap to choose DOCX</span>
          <span class="upload-subtitle">DOCX up to 10MB</span>
          <input type="file" id="template-file-input" name="template_file" accept=".docx" required />
        </label>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="cancel-register">Cancel</button>
        <button type="submit" class="btn btn-primary" id="register-template-btn">Register</button>
      </div>
    </form>
  </div>
</div>

<div id="delete-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal">
    <h3>Delete Template</h3>
    <p>Type <strong>DELETE</strong> to confirm removing <span id="delete-template-name"></span>.</p>
    <input id="delete-confirmation-input" placeholder="DELETE" />
    <div class="btn-group">
      <button class="btn btn-secondary" id="cancel-delete" type="button">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn" type="button">Delete</button>
    </div>
  </div>
</div>
